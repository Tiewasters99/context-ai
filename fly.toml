# Fly.io config for the Contextspaces shared worker.
# Deploy (from repo root, after `fly auth login` once):
#   fly launch --no-deploy --copy-config --name contextspaces-worker
#   fly secrets set VITE_SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... OPENAI_API_KEY=... GOOGLE_API_KEY=...
#   fly deploy
#
# One always-on machine, no public ports — the worker only makes outbound
# calls (Supabase, OpenAI, Gemini). See worker/RUNBOOK.md.
app = "contextspaces-worker"
primary_region = "ewr"

[build]
  dockerfile = "worker/Dockerfile"

[[vm]]
  # shared-cpu-1x caps at 2048 MiB, which is not enough headroom for the large
  # scans that were OOM-killing this machine. 2x is the smallest tier that
  # allows 4gb, and the extra core is useful anyway: OCR and ffmpeg transcodes
  # are the slow path here.
  size = "shared-cpu-2x"
  # 1gb OOM-killed the worker on large scans (2026-08-02): a 2,000-page PDF
  # holds the file buffer, the rendered pages, and the passage array at once,
  # and SIGKILL runs no catch block — so the job died silently and burned a
  # retry attempt each time. Headroom is cheaper than a poison-pill loop.
  memory = "4gb"

# No [[services]] section on purpose: nothing listens; Fly keeps the process
# running and restarts it if it exits.
[processes]
  worker = "node worker/discovery-worker.mjs"
