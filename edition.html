<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/reader-favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/reader-apple-touch-icon.png" />
    <link rel="manifest" href="/reader.webmanifest" />
    <script>
      // At reader.grapheon.ai the Reader is the whole site: the app starts at "/".
      if (!/^\/reader(\/|$)/.test(location.pathname)) document.querySelector('link[rel="manifest"]').href = '/reader-root.webmanifest';
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ecd8" />
    <!-- Installable as a home-screen app (iPhone: Share → Add to Home Screen;
         Android Chrome: Install). No service worker on purpose: the app deploys
         often and a cache layer would hand phones a stale bundle. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Grapheon" />
    <title>Grapheon Reader</title>
    <!-- The Grapheon Reader on its own: My Library, the Reader, the Workshop.
         Served at read.grapheon.ai (a host rewrite in vercel.json) and, until
         that record exists, under /reader on contextspaces.ai. -->
    <style>
      html, body { margin: 0; height: 100%; background: #f4ecd8; overscroll-behavior: none; }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/edition/main.tsx"></script>
  </body>
</html>
