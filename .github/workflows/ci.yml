name: CI

# Every pull request, and every push that lands on main, gets the same
# mechanical check Eden used to run by hand. Nothing here needs a secret: the
# offline harnesses either stub fetch, or run the real migration files inside
# PGlite (Postgres compiled to WASM), or just read source files and compare.
#
# What deliberately does NOT run here, and why, is written down in docs/CI.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are not. Two merges can
  # land minutes apart here, and the first one still needs a recorded result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-verify:
    name: build + offline harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Nothing in this job drives a browser. Puppeteer is only used by LIVE
      # harnesses (scripts/_verify-reader-pagination.mjs), which never run
      # here, so skipping the Chromium download keeps `npm ci` short.
      PUPPETEER_SKIP_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          # package.json engines says ">=22" and worker/Dockerfile pins
          # node:22-slim, so 22 is the version the repo actually targets.
          # It must stay >= 22.18: three harnesses import .ts modules from
          # src/ and rely on Node's built-in type stripping.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npx tsc -b

      - name: Vite build
        run: npx vite build

      # Lint is NON-BLOCKING on purpose. On main at b97d6c6 `npm run lint`
      # reports 68 problems (60 errors, 8 warnings) — almost all
      # react-hooks/set-state-in-effect and no-explicit-any in src/. Making it
      # blocking today would fail every PR for pre-existing debt, and
      # mass-fixing it belongs in its own change. When the count reaches zero,
      # delete the continue-on-error line and this comment.
      - name: ESLint (non-blocking — 60 pre-existing errors on main)
        run: npm run lint
        continue-on-error: true

      # PGlite is a harness-only dependency: --no-save keeps it out of
      # package.json exactly as the local drill does. Versions are pinned so a
      # CI run and a local run execute the same Postgres.
      - name: Install PGlite (harness-only, never a repo dependency)
        run: npm i --no-save @electric-sql/pglite@0.5.8 @electric-sql/pglite-pgvector@0.0.9

      # ---- offline harnesses -------------------------------------------
      # `if: ${{ !cancelled() }}` so one red harness does not hide the rest;
      # the job still fails, but the log shows every result.

      - name: SecureSpace — seal pipes (stubbed fetch, egress witness)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-seal-pipes.mjs

      - name: SecureSpace — Bedrock pen (offline sections; live section skips without keys)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-bedrock-pen.mjs

      - name: SecureSpace — voyage-4 SageMaker route (SigV4 + request shape)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-voyage-route.mjs

      - name: SecureSpace — sealed-embedding HOLD
        if: ${{ !cancelled() }}
        run: node scripts/_verify-embed-hold.mjs

      - name: SecureSpace — a sealed matter refuses, never falls back
        if: ${{ !cancelled() }}
        run: node scripts/_verify-sealed-no-fallback.mjs

      - name: SecureSpace — a sealed CHILD inside an open parent is not searched
        if: ${{ !cancelled() }}
        run: node scripts/_verify-sealed-descendants.mjs

      - name: SecureSpace — a sealed meeting's transcript stays inside the seal
        if: ${{ !cancelled() }}
        run: node scripts/_verify-sealed-meetings.mjs

      - name: SecureSpace — /api/llm sealed route (real handler, stubbed fetch)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-llm-sealed-route.mjs

      - name: Agents — charter narrowing rule (offline part)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-agent-charter.mjs

      - name: Agents — tool menu vs server charters
        if: ${{ !cancelled() }}
        run: node scripts/_verify-agent-tools.mjs

      - name: Migration 057 — job priority (PGlite)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-job-priority.mjs

      - name: Migration 058 — recovery sweep at scale (PGlite)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-recovery-sweep.mjs

      - name: Migration 059 — ready_but_empty (PGlite)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-ready-but-empty.mjs

      - name: Migration 060 — 'held' is terminal (PGlite)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-held-status.mjs

      - name: Migration 061 — search is model-scoped (PGlite + pgvector)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-search-model-scope.mjs

      - name: Migration 062 — profiles RLS, no email column (PGlite)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-profiles-rls.mjs

      - name: Migration 063 — spend cap, database half (PGlite)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-usage-budget.mjs

      # The handler half of the same spend cap. It is written as a node:test
      # suite, so it needs --test; plain `node` would run it but report nothing.
      - name: Spend cap — usage meter and prices (handler half, node --test)
        if: ${{ !cancelled() }}
        run: node --test scripts/_test-usage-meter.mjs

      - name: Office — one owner's public room, and nothing else
        if: ${{ !cancelled() }}
        run: node scripts/_verify-office-tenancy.mjs

      - name: Ingestion — stamp-only scans reach OCR (fake Supabase, stubbed OCR)
        if: ${{ !cancelled() }}
        run: node scripts/_test-stamp-scans.mjs

      - name: Reader — reflow
        if: ${{ !cancelled() }}
        run: node scripts/_verify-reflow.mjs

      - name: Reader — findQuote locator
        if: ${{ !cancelled() }}
        run: node scripts/_verify-findquote.mjs

      # reader-copy.ts imports through the vite '@/' alias, which plain node
      # cannot resolve; scripts/_node-src-loader.mjs teaches it to.
      - name: Reader — clean copy extraction
        if: ${{ !cancelled() }}
        run: node --import ./scripts/_node-src-loader.mjs scripts/_verify-reader-copy.mjs

      # Migration 067 executed against PGlite on top of the REAL 062 and 063,
      # then the real billing handlers driven against that database with Stripe
      # and PostgREST stubbed. Offline by construction: there is no Stripe
      # account, and this harness never opens a socket to one.
      - name: Migration 067 — billing, credits and the webhook (PGlite + real handlers)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-billing.mjs
      - name: Migration 064 — the matter Record is append-only (PGlite)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-ledger.mjs

      # The pause is a safety switch, so what it is worth is what can be
      # demonstrated about it: every model-facing case runs with global fetch
      # replaced by a witness and asserts the witness saw nothing. Part C is a
      # negative control — the same scenarios where the guard is absent, where
      # the witness MUST fire. Its git-based half needs the base branch, which
      # a shallow checkout does not have; it says so and skips, and the
      # portable half covers the same ground.
      - name: Migration 070 — AI pause, every path, zero egress (PGlite)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-ai-pause.mjs
      # The Record's read side lives in src/lib/matter-record/*.ts, so this one
      # needs the same '@/' loader as the reader harness above.
      - name: The matter's Record — roll-up, docket lines and the export
        if: ${{ !cancelled() }}
        run: node --import ./scripts/_node-src-loader.mjs scripts/_verify-matter-record.mjs
      - name: Migration 072 — the account chain, fan-out isolation, immutable sessions (PGlite)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-ledger-account.mjs
      # The offline stand-in for worker/e2e-live-test.mjs, which cannot run here
      # (prod database, service role). Executes 030 + 032 + 044 + 045 + 055 +
      # 057 + 058 + 059 + 060 in PGlite and drives the real lib/discovery engine
      # over a synthetic production with storage stubbed. It also greps the
      # worker source for the invariants it transcribes, so a rewrite of the
      # worker's stamp or intake loop turns this red instead of drifting away
      # from the thing it claims to verify.
      - name: Discovery — intake → stamp → package → deliver (PGlite, stubbed storage)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-discovery-pipeline.mjs
      # Day one for a new paying user: which file types are accepted or
      # refused (and whether the refusal names an alternative), whether a
      # mid-size document may run on the 60 s serverless budget, that the
      # nightly suite cannot hang without leaving a record, and that the
      # monitor digest cannot mail one tenant's filenames to another account.
      # It runs scripts/_verify-ocr-routes.mjs as a child process and asserts
      # its exit code, so the OCR route policy is covered by this step too.
      - name: Ingestion — day one (types, routing, suite deadlines, digest privacy, OCR routes)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-ingest-day-one.mjs

      # Migration 066 + the worker's heartbeat + the sentence the Vault shows
      # while a document is processing + the nightly workflow itself. The
      # tenant boundary is the point: two signed-in users, each seeing only
      # their own queue numbers. It also runs `ingest-suite.mjs --dry-run` as a
      # child process, which is how this job proves the nightly suite can be
      # invoked on Linux with no `.env` at all.
      - name: Ingestion — worker liveness (migration 066, PGlite + offline)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-worker-heartbeat.mjs
      # Whole-document windowing, the resumable run, the meter pause, the
      # deterministic merge, and the paged read shared with Discovery. Offline:
      # the model, the database and PostgREST are all stubbed.
      - name: Bucketizer — whole-document scale + paged reads
        if: ${{ !cancelled() }}
        run: node --import ./scripts/_node-src-loader.mjs scripts/_verify-bucketizer-scale.mjs

      # The evidence lane: verbatim quotation (a span the stored passage does
      # not hold is dropped, never repaired), citations that degrade honestly
      # where the record has no line numbers, gaps-first assembly, a
      # byte-identical .md on a re-run, and a real .docx read back with the
      # repo's own docx library. Migration 068 is EXECUTED in PGlite in the
      # same step. Offline: the model, the database and PostgREST are stubbed.
      - name: Bucketizer — evidence, citations and the trial outline
        if: ${{ !cancelled() }}
        run: |
          node scripts/_verify-bucketizer-evidence.mjs
          node --import ./scripts/_node-src-loader.mjs scripts/_verify-bucketizer-outline.mjs
      # The Vault's own read, at 2,500 and 12,000 documents with every
      # created_at tied — the dropped-folder case that makes an untiebroken
      # `.range()` loop lose rows. Offline: PostgREST is stubbed.
      - name: Vault — matter-tree document list, paged
        if: ${{ !cancelled() }}
        run: node --import ./scripts/_node-src-loader.mjs scripts/_verify-vault-paged-reads.mjs
      # Its negative control reconstructs main's handlers by deleting the
      # marked gate block, then watches them leak. One extra assertion —
      # "the reconstruction IS origin/main's file" — only means anything
      # before the gate lands, so it prints SKIP where the base ref is not
      # fetched (a PR checkout) or already carries the gate (main).
      - name: SecureSpace — export gate (egress witness + negative control)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-export-gate.mjs
      # Runs migration 065 in PGlite AND drives api/oauth-approve.mjs,
      # api/oauth-token.mjs and lib/oauth-grants.mjs against it through a
      # stubbed PostgREST — no network. Guards the part that would hurt most
      # if it broke: a pre-065 token must keep working until the cut-off, and
      # merging before the migration is pasted must disconnect nobody.
      - name: Migration 065 — per-connection OAuth grants (PGlite + handlers)
        if: ${{ !cancelled() }}
        run: node scripts/_verify-oauth-grants.mjs
      # The cover picker: the allow-list is well-formed and points at files
      # that exist, then the gating rule itself (core vs workshop vs still
      # loading, and what a failed read is allowed to offer).
      - name: Covers — core set valid, and the picker gate
        if: ${{ !cancelled() }}
        run: |
          node scripts/_validate-cover-manifest.mjs
          node --test scripts/_test-cover-gating.mjs
      # The browser half of a refused request: 402 (spend cap), 429 (rate
      # window) and the sealed 403/502/503 all become a sentence a person can
      # read. Same loader as above — refusals.ts is a .ts module in src/.
      - name: Refusals — 402 / 429 / sealed read as English
        if: ${{ !cancelled() }}
        run: node --import ./scripts/_node-src-loader.mjs --test scripts/_test-server-refusals.mjs
      # What the Assistant panel SAYS on a sealed matter before the first
      # message: the scope strip, the pen named in advance (and corrected when
      # the server names another), the word-search note, the pause, the
      # starters, the matter header's door, and the panel's pin/position
      # record. Pure modules plus narrow source assertions for the wiring — no
      # loader needed, nothing mounted, no network.
      - name: Assistant — a sealed matter says where it is and who answers
        if: ${{ !cancelled() }}
        run: node --test scripts/_test-sealed-assistant-scope.mjs
